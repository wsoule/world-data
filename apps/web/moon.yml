$schema: 'https://moonrepo.dev/schemas/project.json'

# The World Data single-page app (Vite + React + TanStack). The static dataset
# it serves lives in public/data and is regenerated by the data-* tasks.
# Inherits test/typecheck from the shared bun-common tasks.
language: 'typescript'
layer: 'application'

tasks:
  # vite build prerenders the content pages and writes sitemap.xml; then
  # seo-files.ts adds robots.txt, llms.txt, the web manifest and topic CSVs.
  build:
    script: 'vite build && bun scripts/seo-files.ts'
    deps:
      - '^:build'
    inputs:
      - 'src/**/*'
      - 'public/**/*'
      - 'index.html'
      - 'vite.config.ts'
      - 'tsconfig.json'
      - 'scripts/prerender-pages.ts'
      - 'scripts/seo-files.ts'
      - 'scripts/page-data.ts'
      - 'scripts/static-pages.ts'
      - 'scripts/lib/**/*'
    outputs:
      - 'dist'

  # Dev server on 5173 (+ worktree offset). Graph-connected (^:build), so it
  # stays CI-skipped; in CI-marked shells run
  # `moonx web:dev --ignore-ci-checks`.
  dev:
    script:
      'PORT=$(( ${WORKTREE_PORT_OFFSET:-0} + 5173 )) && bash
      ../../scripts/run-dev.sh "$PORT" -- vite --port "$PORT" --strictPort'
    deps:
      - '^:build'
    options:
      cache: false
      persistent: true
      envFile: '/.env.worktree'
      runInCI: 'skip'

  # Serves the production build on 4173 (+ worktree offset).
  preview:
    script:
      'PORT=$(( ${WORKTREE_PORT_OFFSET:-0} + 4173 )) && bash
      ../../scripts/run-dev.sh "$PORT" -- vite preview --port "$PORT"
      --strictPort'
    deps:
      - 'build'
    options:
      cache: false
      persistent: true
      envFile: '/.env.worktree'
      runInCI: 'skip'

  # Cache the worldpopulationreview.com ranking pages (polite, resumable).
  # Forward flags with `moonx web:data-fetch -- --refresh`.
  data-fetch:
    command: 'bun scripts/fetch-pages.ts'
    options:
      cache: false
      runInCI: 'always'

  # Check what AI answer engines and crawlers get from a sample of the live
  # pages (docs/geo.md). `moonx web:geo-audit -- --dist` audits the local build.
  geo-audit:
    command: 'bun scripts/geo-audit.ts'
    options:
      cache: false
      runInCI: 'always'

  # Ask the docs/geo.md questions through AI search APIs and log whether the
  # answers cite rankodex.com (.cache/geo/citations.csv). Engines without a key
  # in the environment are skipped.
  geo-citations:
    command: 'bun scripts/geo-citations.ts'
    options:
      cache: false
      runInCI: 'always'

  # Parse the page cache into public/data.
  data-build:
    command: 'bun scripts/build-data.ts'
    options:
      cache: false
      runInCI: 'always'
